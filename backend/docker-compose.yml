version: '3.8'

services:
  # FastAPI Application Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seniorcare_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://seniorcare_admin:seniorcare_secure_pass@postgres:5432/seniorcare_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app

  # Background Asynchronous Task Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seniorcare_celery_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://seniorcare_admin:seniorcare_secure_pass@postgres:5432/seniorcare_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - postgres
      - redis

  # PostgreSQL 16 Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: seniorcare_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=seniorcare_admin
      - POSTGRES_PASSWORD=seniorcare_secure_pass
      - POSTGRES_DB=seniorcare_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seniorcare_admin -d seniorcare_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 In-Memory Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: seniorcare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

